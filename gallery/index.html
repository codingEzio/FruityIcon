<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FruityIcon gallery</title>
    <link rel="stylesheet" href="gallery.css">
    <script src="gallery.js" defer></script>
  </head>
  <body>
    <svg aria-hidden="true" class="svg-defs" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="comparison-1" viewBox="0 0 24 24">
          <circle cx="10.5" cy="10.5" r="6.5" />
          <path d="m16 16 5 5" />
        </symbol>
        <symbol id="comparison-2" viewBox="0 0 24 24">
          <path d="M12 4v16M4 12h16" />
        </symbol>
        <symbol id="comparison-3" viewBox="0 0 24 24">
          <path
            d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z" />
        </symbol>
        <symbol id="comparison-4" viewBox="0 0 24 24">
          <path d="m7 9 5-5 5 5M12 4v11M4 16v4h16v-4" />
        </symbol>
        <symbol id="comparison-5" viewBox="0 0 24 24">
          <path d="m7 10 5 5 5-5M12 4v11M4 16v4h16v-4" />
        </symbol>
        <symbol id="comparison-6" viewBox="0 0 24 24">
          <path
            d="m9 3 1-1h4l1 3 3 1 3-1 2 4-2 2v3l2 2-2 4-3-1-3 1-1 3h-4l-1-3-3-1-3 1-2-4 2-2v-3L1 9l2-4 3 1 3-1Z"
            transform="translate(0 0) scale(.92)" />
          <circle cx="12" cy="12" r="3.5" />
        </symbol>
        <symbol id="comparison-7" viewBox="0 0 24 24">
          <rect x="8" y="8" width="12" height="13" rx="2" />
          <path d="M16 8V3H3v13h5" />
        </symbol>
        <symbol id="comparison-8" viewBox="0 0 24 24">
          <path d="m4 16-1 5 5-1L21 7l-4-4Z M14 6l4 4" />
        </symbol>
        <symbol id="comparison-9" viewBox="0 0 24 24">
          <path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7" />
        </symbol>
        <symbol id="comparison-10" viewBox="0 0 24 24">
          <path
            d="m10 14 4-4M8 16l-2 2a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0M16 8l2-2a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0"
            transform="translate(2 0) scale(.83 1)" />
        </symbol>
        <symbol id="comparison-11" viewBox="0 0 24 24">
          <circle cx="5" cy="12" r="3" />
          <circle cx="18" cy="5" r="3" />
          <circle cx="18" cy="19" r="3" />
          <path d="m8 10 7-4M8 14l7 4" />
        </symbol>
        <symbol id="comparison-12" viewBox="0 0 24 24">
          <path d="M20 10a8 8 0 1 0-1 7M20 3v7h-7" />
        </symbol>
      </defs>
    </svg>
    <header><h1>FruityIcon</h1><a href="../demo/" data-i18n="tool">Geometry tool</a></header>
    <main>
      <section class="controls" aria-label="Preferences">
        <label><span data-i18n="language">Language</span><select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="zh-Hans">简体中文</option></select></label>
        <label><span data-i18n="theme">Theme</span><select id="theme"><option value="system" data-i18n="system">System</option><option value="light" data-i18n="light">Light</option><option value="dark" data-i18n="dark">Dark</option></select></label>
        <label><span data-i18n="font">Font</span><select id="font"><option value="system" data-i18n="system">System</option><option value="pixel" data-i18n="pixel">Pixel</option></select></label>
      </section>
      <div
        class="controls"><label><span data-i18n="size">Size</span><input id="size" type="range" min="16" max="48" step="2" value="24"><output id="size-value">24 px</output></label><label><span data-i18n="fit">Optical fit</span><input id="fit" type="checkbox" checked></label><label><span data-i18n="mono">Monochrome</span><input id="mono" type="checkbox"></label></div>
      <div
        class="controls"><label><span data-i18n="importPrefs">Import preferences JSON</span><input id="prefs-file" type="file" accept="application/json,.json"></label><button id="import-old" type="button" hidden data-i18n="importOld">Import previous preferences</button><button id="export-prefs" type="button" data-i18n="exportPrefs">Export preferences</button></div>
      <p id="notice" role="status"></p>
      <section id="library" hidden>
        <div
          class="filters"><label><span data-i18n="search">Search</span><input id="search" type="search"></label><label><span data-i18n="category">Category</span><select id="category"></select></label></div>
        <p id="count" role="status"></p>
        <div class="layout">
          <div id="items" class="items"></div>
          <section id="detail" class="detail"
            hidden><h2 id="name"></h2><p id="description"></p><div class="comparison"><div><span data-i18n="artwork">Artwork</span><div id="preview"></div></div><div id="vector-comparison"><span data-i18n="vector">SVG comparison</span><div id="vector-preview"></div></div></div><div id="sizes"></div><a id="download" download data-i18n="download">Download source</a><button id="copy" data-i18n="copy">Copy CSS</button><button id="favorite" data-i18n="favorite">Favorite</button><button id="add" data-i18n="add">Add to tray</button><pre id="recipe"></pre></section>
        </div>
        <section
          class="sample"><h2 data-i18n="tray">Tray</h2><div id="tray"></div><label><span data-i18n="upload">Preview local PNG</span><input id="upload" type="file" accept="image/png"></label><img id="local-preview" hidden alt=""><button id="clear-upload" type="button" data-i18n="remove">Remove image</button><button id="reset-demo" type="button" data-i18n="reset">Reset sample</button></section>
      </section>
    </main>
  </body>
</html>
